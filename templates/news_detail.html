{% extends 'base.html' %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
    <section class="news-detail section-wrap">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="{% url 'home' %}" data-t="navHome">Home</a>
            <span>/</span>
            <a href="{% url 'news' %}" data-t="navNews">News</a>
            <span>/</span>
            <span>{{ article.title }}</span>
        </nav>
        <article class="news-detail-article">
            <time datetime="{{ article.created_at|date:'c' }}">{{ article.created_at|date:'d.m.Y' }}</time>
            <h1>{{ article.title }}</h1>
            <div class="news-detail-content">{{ article.content|linebreaks }}</div>
            <a class="under-link" href="{% url 'news' %}"><span data-t="navNews">Back to news</span> </a>
        </article>
    </section>
{% endblock %}
